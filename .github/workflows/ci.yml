name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build (host)
        run: go build -o kalshi-perp ./cmd/kalshi-perp

  # Cross-compile the same matrix GoReleaser ships (no publish).
  build-matrix:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=ci" \
            -o "kalshi-perp-${{ matrix.goos }}-${{ matrix.goarch }}" \
            ./cmd/kalshi-perp
          file "kalshi-perp-${{ matrix.goos }}-${{ matrix.goarch }}" || true
          ls -la "kalshi-perp-${{ matrix.goos }}-${{ matrix.goarch }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-perp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: kalshi-perp-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
